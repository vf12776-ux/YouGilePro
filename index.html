<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouGile Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon45-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 360px;
            width: 100%;
            background: white;
            border-radius: 48px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.1);
        }
        .logo {
            width: 88px;
            height: 88px;
            background: #2563eb;
            border-radius: 24px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        h1 { font-size: 28px; margin: 0 0 8px; }
        .sub { color: #475569; margin-bottom: 32px; font-size: 16px; }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.97); }
        .info {
            font-size: 13px;
            color: #64748b;
            margin-top: 24px;
        }
        /* Модальное окно для iOS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 32px;
            max-width: 300px;
            width: 90%;
            padding: 24px;
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; }
        .modal-steps {
            text-align: left;
            margin: 20px 0;
        }
        .modal-steps p {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }
        .modal-steps span {
            background: #e2e8f0;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-weight: bold;
        }
        .close-modal {
            background: #000;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="card" id="card">
    <div class="logo">📋</div>
    <h1>YouGile Pro</h1>
    <div class="sub">Быстрый доступ к порталу</div>
    <button id="installBtn">Установить приложение</button>
    <div class="info">После установки откройте приложение с иконки — портал запустится в браузере</div>
</div>

<!-- Модалка для iOS -->
<div id="iosModal" class="modal">
    <div class="modal-content">
        <h3>📱 Как установить на iPhone / iPad</h3>
        <div class="modal-steps">
            <p><span>1</span> Нажмите кнопку «Поделиться»</p>
            <p><span>2</span> Выберите «На экран «Домой»</p>
            <p><span>3</span> Нажмите «Добавить»</p>
        </div>
        <button class="close-modal" id="closeModal">Понятно, спасибо</button>
    </div>
</div>

<script>
    (function() {
        const TARGET = 'https://www.yougile.com/board/6ld5e6qu67te';
        
        // 1. Если приложение уже установлено и запущено с иконки — редирект в браузер
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                             ('standalone' in window.navigator && window.navigator.standalone === true);
        if (isStandalone) {
            window.location.href = TARGET;
            return;
        }

        // 2. Определяем платформу
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const installBtn = document.getElementById('installBtn');
        
        // Android: beforeinstallprompt
        let deferredPrompt = null;
        if (!isIOS) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.disabled = false;
            });
        }

        // 3. Обработчик кнопки
        installBtn.addEventListener('click', () => {
            if (isIOS) {
                // Показываем модалку с инструкцией
                const modal = document.getElementById('iosModal');
                modal.style.display = 'flex';
                document.getElementById('closeModal').onclick = () => {
                    modal.style.display = 'none';
                };
                // Закрытие по клику вне модалки
                modal.onclick = (e) => {
                    if (e.target === modal) modal.style.display = 'none';
                };
            } else {
                // Android
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            installBtn.innerText = '✅ Приложение установлено!';
                            installBtn.disabled = true;
                        }
                        deferredPrompt = null;
                    });
                } else {
                    alert('Ваш браузер не поддерживает автоматическую установку.\nДобавьте приложение вручную через меню браузера.');
                }
            }
        });

        // 4. Регистрация Service Worker (нужен для beforeinstallprompt на Android)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error', e));
        }
    })();
</script>
</body>
</html>
