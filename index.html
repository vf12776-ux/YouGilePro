<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouGile в браузере</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message { text-align: center; color: #1e293b; }
        .link { margin-top: 24px; font-size: 14px; }
        .link a { color: #3b82f6; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="message">
        <div class="loader"></div>
        <div>Открываем портал YouGile...</div>
        <div class="link">
            <a id="manualLink">Нажмите, если редирект не сработал</a>
        </div>
    </div>
    <script src="launcher.js"></script>
</body>
</html>
